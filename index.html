<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        try {
          var ls = JSON.parse(localStorage.getItem('tradeflow-app-store') || '{}');
          var theme = ls.theme || 'default';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'light') document.documentElement.classList.add('theme-light');
          else if (theme === 'dark') document.documentElement.classList.add('theme-dark');
          else document.documentElement.classList.add(prefersDark ? 'theme-dark' : 'theme-light');
        } catch(e) {
          document.documentElement.classList.add('theme-dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
